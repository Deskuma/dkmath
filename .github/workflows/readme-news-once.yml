name: One-shot README news update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-news-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Insert Breaking Math Verification news
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          marker = "## News\n\n"
          title = "> ## OpenAI Build Week: Breaking Math Verification"

          entry = """> ## OpenAI Build Week: Breaking Math Verification

DkMath's second OpenAI Build Week submission turns a newly reported three-variable Jacobian-conjecture candidate into an auditable Lean verification package built with GPT-5.6 and Codex.

Lean independently reconstructs the polynomial map over `ℚ` and `ℂ`, proves that its formal Jacobian determinant is `-2`, and verifies an exact output normalization with determinant `1`. It also checks three pairwise-distinct inputs that map to the same target `(1/8, 0, 0)`, yielding kernel-checked proofs of noninjectivity and the absence of a set-theoretic left inverse.

The work also introduces the reusable public API `DkMath.Verification.CollisionCertificate`, together with focused axiom audits, provenance records, Demo contracts, and a reproducible verification workflow.

Lean verifies the exact formalized formulas and consequences. Historical priority, publication status, peer review, and broader community acceptance remain outside the scope of the certificate.

- Project entry point: [Jacobian Counterexample Verification](./lean/dk_math/DkMath/Hackathon/JacobianCounterexample3/README.md)
- Full verification record: [Breaking Math Verification](./lean/dk_math/docs/hackathon/jacobian-counterexample-verification-260721/README.md)
- Generic verification API: [DkMath.Verification](./lean/dk_math/DkMath/Verification.lean)
- Demo video: [Breaking Math Verification](https://youtu.be/IGNKJBknzrQ)
- Devpost submission: [Breaking Math Verification](https://devpost.com/software/breaking-math-verification)
- Main integration: [PR #63](https://github.com/Deskuma/dkmath/pull/63)

---

"""

          if title not in text:
              if marker not in text:
                  raise SystemExit("README News marker not found")
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit README and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/readme-news-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/readme-news-once.yml
          git commit -m "Docs: add Breaking Math Verification news"
          git push origin HEAD:main
